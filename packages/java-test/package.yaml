---
name: java-test
description: |
  The Test Runner for Java works with java-debug-adapter to provide the following features:
  - Run/Debug test cases
  - Customize test configurations
  - View test report
  - View tests in Test Explorer

  Enables support for the following test frameworks:

  - JUnit 4 (v4.8.0+)
  - JUnit 5 (v5.1.0+)
  - JUnit 6 (v6.0.1+)
  - TestNG (v6.8.0+)
homepage: https://github.com/microsoft/vscode-java-test
licenses:
  - MIT
languages:
  - Java
categories:
  - DAP
source:
  # renovate:datasource=github-tags
  id: pkg:generic/microsoft/vscode-java-test@0.47.0

  build:
    - target: unix
      env:
        VERSION: "{{ version }}"
      run: |
        curl -fLsS "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-test/$VERSION/vspackage" -o outer.vsix.zip
        7z x -y outer.vsix.zip
        inner="$(find outer.vsix -type f \( -iname '*.zip' -o -iname '*.vsix' \) -print -quit)"
        test -n "$inner"
        7z x -y "$inner"
        rm -f outer.vsix*

    - target: win
      env:
        VERSION: "{{ version }}"
      run: |
        $ErrorActionPreference = 'Stop'

        $url = "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-test/$($env:VERSION)/vspackage"
        curl.exe -fLsS $url -o outer.vsix.zip
        if ($LASTEXITCODE -ne 0) { throw 'Download failed' }

        7z x -y outer.vsix.zip
        if ($LASTEXITCODE -ne 0) { throw 'Outer extraction failed' }

        $inner = Get-ChildItem -LiteralPath 'outer.vsix' -Recurse -File |
          Where-Object { $_.Extension -in @('.zip', '.vsix') } |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $inner) { throw 'Inner archive not found' }

        7z x -y $inner
        if ($LASTEXITCODE -ne 0) { throw 'Inner extraction failed' }

        Remove-Item -LiteralPath 'outer.vsix.zip' -Force -ErrorAction SilentlyContinue

        Remove-Item -LiteralPath 'outer.vsix' -Recurse -Force -ErrorAction SilentlyContinue
share:
  java-test/: extension/server/
