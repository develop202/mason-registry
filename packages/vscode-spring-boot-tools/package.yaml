---
name: vscode-spring-boot-tools
description: |
  VS Code Language Server for Spring Boot
  VSCode extension and Language Server providing support for working with Spring Boot application.properties, application.yml and .java files.

  Note: this extension has a dependency on VS Code extension of Language Support for Java™ by Red Hat.
homepage: https://github.com/spring-projects/spring-tools
licenses:
  - EPL-1.0
languages:
  - Java
categories:
  - LSP
source:
  # renovate:versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+).RELEASE$
  # renovate:datasource=github-releases
  id: pkg:generic/spring-projects/spring-tools@5.4.0.RELEASE

  build:
    env:
      VERSION: '2{{version | strip_prefix "5" | strip_suffix ".RELEASE"}}'
    run: |
      curl -fLsS "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/VMware/vsextensions/vscode-spring-boot/$VERSION/vspackage" -o outer.vsix.zip
      7z x -y outer.vsix.zip
      inner="$(find outer.vsix -type f \( -iname '*.zip' -o -iname '*.vsix' \) -print -quit)"
      test -n "$inner"
      7z x -y "$inner"
      rm -f outer.vsix*
schemas:
  lsp: vscode:https://raw.githubusercontent.com/spring-projects/spring-tools/{{version}}/vscode-extensions/vscode-spring-boot/package.json
