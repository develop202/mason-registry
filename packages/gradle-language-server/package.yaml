---
name: gradle-language-server
description: Gradle language server.
homepage: https://github.com/microsoft/vscode-gradle
licenses:
  - MIT
languages:
  - Gradle
categories:
  - LSP
source:
  # renovate:datasource=github-tags
  id: pkg:generic/microsoft/vscode-gradle@3.18.0

  build:
    - target: unix
      env:
        VERSION: "{{ version }}"
      run: |
        curl -fLsS "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-gradle/$VERSION/vspackage" -o outer.vsix.zip
        7z x -y outer.vsix.zip
        inner="$(find outer.vsix -type f \( -iname '*.zip' -o -iname '*.vsix' \) -print -quit)"
        test -n "$inner"
        7z x -y "$inner"
        rm -f outer.vsix*
    - target: win
      env:
        VERSION: "{{ version }}"
      run: |
        $ErrorActionPreference = 'Stop'

        $url = "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-gradle/$($env:VERSION)/vspackage"
        curl.exe -fLsS $url -o outer.vsix.zip
        if ($LASTEXITCODE -ne 0) { throw 'Download failed' }

        7z x -y outer.vsix.zip
        if ($LASTEXITCODE -ne 0) { throw 'Outer extraction failed' }

        $inner = Get-ChildItem -LiteralPath 'outer.vsix' -Recurse -File |
          Where-Object { $_.Extension -in @('.zip', '.vsix') } |
          Select-Object -First 1 -ExpandProperty FullName

        if (-not $inner) { throw 'Inner archive not found' }

        7z x -y $inner
        if ($LASTEXITCODE -ne 0) { throw 'Inner extraction failed' }

        Remove-Item -LiteralPath 'outer.vsix.zip' -Force -ErrorAction SilentlyContinue

        Remove-Item -LiteralPath 'outer.vsix' -Recurse -Force -ErrorAction SilentlyContinue

schemas:
  lsp: vscode:https://raw.githubusercontent.com/microsoft/vscode-gradle/{{version}}/extension/package.json
bin:
  gradle-language-server: java-jar:extension/lib/gradle-language-server.jar
neovim:
  lspconfig: gradle_ls
