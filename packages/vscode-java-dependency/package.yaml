---
name: vscode-java-dependency
description: Visual Studio Code extension for managing Java projects, dependencies, and exporting JAR files
homepage: https://github.com/Microsoft/vscode-java-dependency
licenses:
  - MIT
languages:
  - Java
categories:
  - Runtime
source:
  # renovate:datasource=github-tags
  id: pkg:generic/Microsoft/vscode-java-dependency@0.27.7
  build:
    env:
      VERSION: "{{ version }}"
    run: |
      curl -fLsS "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/vscjava/vsextensions/vscode-java-dependency/$VERSION/vspackage" -o outer.vsix.zip
      7z x -y outer.vsix.zip
      inner="$(find outer.vsix -type f \( -iname '*.zip' -o -iname '*.vsix' \) -print -quit)"
      test -n "$inner"
      7z x -y "$inner"
      rm -f outer.vsix*
share:
  vscode-java-dependency/: extension/server/
